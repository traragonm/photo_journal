<!doctype html>
<html lang="vi">

<body>
<x-dc>
<helmet>

body{margin:0}
a{color:#26221E}a:hover{color:#000000}

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECE6DB; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #26221E; display: flex; flex-direction: column">

</a>

<div style="padding: 10px 28px 0; display: flex; justify-content: space-between; align-items: flex-end">
<div>
<div style="font-size: 12px; color: #6B6258; letter-spacing: 0.06em; text-transform: uppercase">Thứ Sáu, 2 tháng 10</div>

</div>
<div style="font-family: 'Patrick Hand', cursive; font-size: 22px; color: #6B6258; padding-bottom: 4px">3 tấm ảnh</div>
</div>

<div style="position: relative; height: 486px; margin-top: 6px">

<figure style="position: absolute; left: 16px; top: 22px; width: 200px; height: 318px; box-sizing: border-box; padding: 14px 14px 0; margin: 0; background: {{frame}}; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,0.14), 0 12px 26px rgba(70,45,20,0.20); transform: rotate(-9deg); display: flex; flex-direction: column">
<div style="width: 172px; height: 230px; overflow: hidden; background: #B98D66">
<svg width="172" height="230" viewBox="0 0 172 230" aria-hidden="true"><rect width="172" height="70" fill="#D8B48C"></rect><rect y="168" width="172" height="62" fill="#8C6446"></rect><ellipse cx="86" cy="122" rx="48" ry="46" fill="#F3EEE6"></ellipse><ellipse cx="86" cy="122" rx="35" ry="33" fill="#5A3A26"></ellipse><ellipse cx="80" cy="116" rx="14" ry="8" fill="#C99B6D" opacity="0.7"></ellipse><path d="M132 112c18 0 18 22 0 22" fill="none" stroke="#F3EEE6" stroke-width="8"></path></svg>
</div>
<figcaption style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 2px; font-family: 'Patrick Hand', cursive; font-size: 19px; line-height: 1.1; color: {{ink}}">Cà phê sáng<span style="font-size: 14px; color: {{inkSoft}}">07:42</span></figcaption>
</figure>

<figure style="position: absolute; left: 176px; top: 6px; width: 200px; height: 318px; box-sizing: border-box; padding: 14px 14px 0; margin: 0; background: {{frame}}; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,0.14), 0 12px 26px rgba(70,45,20,0.20); transform: rotate(7deg); display: flex; flex-direction: column">
<div style="width: 172px; height: 230px; overflow: hidden; background: #CFD9D6">
<svg width="172" height="230" viewBox="0 0 172 230" aria-hidden="true"><rect x="20" y="70" width="80" height="120" fill="#E4C9A5"></rect><rect x="32" y="86" width="16" height="20" fill="#9C7F62"></rect><rect x="64" y="86" width="16" height="20" fill="#9C7F62"></rect><rect x="32" y="122" width="16" height="20" fill="#9C7F62"></rect><rect x="64" y="122" width="16" height="20" fill="#9C7F62"></rect><rect y="186" width="172" height="44" fill="#A9A196"></rect><rect x="128" y="120" width="8" height="70" fill="#6A5442"></rect><circle cx="132" cy="104" r="34" fill="#6E8B5C"></circle><circle cx="114" cy="122" r="22" fill="#587349"></circle></svg>
</div>
<figcaption style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 2px; font-family: 'Patrick Hand', cursive; font-size: 19px; line-height: 1.1; color: {{ink}}">Trưa đi bộ<span style="font-size: 14px; color: {{inkSoft}}">12:30</span></figcaption>
</figure>

<figure style="position: absolute; left: 92px; top: 132px; width: 206px; height: 328px; box-sizing: border-box; padding: 15px 15px 0; margin: 0; background: {{frame}}; border-radius: 3px; box-shadow: 0 2px 3px rgba(0,0,0,0.16), 0 18px 34px rgba(70,45,20,0.26); transform: rotate(-2deg); display: flex; flex-direction: column">
<div style="width: 176px; height: 236px; overflow: hidden; background: #EBB08A">
<svg width="176" height="236" viewBox="0 0 176 236" aria-hidden="true"><circle cx="112" cy="118" r="28" fill="#F6DCB4"></circle><path d="M0 132 40 104 78 126 120 98 176 130V146H0z" fill="#8C6B6A"></path><rect y="144" width="176" height="92" fill="#5D7A8A"></rect><rect x="92" y="156" width="40" height="3" fill="#F6DCB4" opacity="0.7"></rect><rect x="100" y="170" width="24" height="3" fill="#F6DCB4" opacity="0.5"></rect><rect x="106" y="184" width="12" height="3" fill="#F6DCB4" opacity="0.4"></rect></svg>
</div>
<figcaption style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 2px; font-family: 'Patrick Hand', cursive; font-size: 21px; line-height: 1.1; color: {{ink}}">Hoàng hôn trên hồ<span style="font-size: 14px; color: {{inkSoft}}">17:58</span></figcaption>
</figure>

</div>

<p style="margin: 0; text-align: center; font-size: 12px; color: #6B6258">Chạm để xem ảnh · Giữ để viết ghi chú</p>

<a href="Map.dc.html" aria-label="Mở bản đồ" style="position: absolute; left: 0; top: 352px; width: 44px; height: 112px; display: flex; align-items: center; justify-content: flex-start; text-decoration: none; z-index: 5">
<span style="width: 26px; height: 100px; border-radius: 0 14px 14px 0; background: #26221E; color: #F4EFE6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
<span style="writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 600; letter-spacing: 0.08em">BẢN ĐỒ</span>
</span>
</a>

<a href="Camera.dc.html" aria-label="Mở camera" style="position: absolute; right: 0; top: 352px; width: 44px; height: 112px; display: flex; align-items: center; justify-content: flex-end; text-decoration: none; z-index: 5">
<span style="width: 26px; height: 100px; border-radius: 14px 0 0 14px; background: {{accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="writing-mode: vertical-rl; font-size: 10px; font-weight: 600; letter-spacing: 0.08em">CHỤP</span>
</span>
</a>

<div style="margin-top: auto; padding: 0 18px 6px">
<div style="display: flex; justify-content: space-between">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button aria-label="{{d.label}}" style="width: 44px; height: 66px; border: 0; padding: 0; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; cursor: pointer">{{d.dow}}<span style="font-size: 17px; font-weight: 600">{{d.num}}</span><span style="width: 5px; height: 5px; border-radius: 50%; background: {{d.dot}}"></span></button>
</sc-for>
</div>
</div>

<a href="Calendar.dc.html" aria-label="Kéo lên để mở lịch ảnh" style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 16px; text-decoration: none; color: #6B6258">
<span style="font-size: 12px; display: flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Kéo lên · Lịch ảnh</span>
<span style="width: 40px; height: 5px; border-radius: 3px; background: #B9AFA2"></span>
</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"color","default":"#FBFAF6","options":["#FBFAF6","#F2E6CF","#1E1C1A"]},"accent":{"editor":"color","default":"#C2402A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const frame = this.props.frame ?? '#FBFAF6';
    const hex = frame.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    const dark = (0.299 * r + 0.587 * g + 0.114 * b) < 128;
    const raw = [
      { dow: 'T2', num: '28', has: true },
      { dow: 'T3', num: '29', has: false },
      { dow: 'T4', num: '30', has: true },
      { dow: 'T5', num: '1', has: true },
      { dow: 'T6', num: '2', has: true, today: true },
      { dow: 'T7', num: '3', has: false, future: true },
      { dow: 'CN', num: '4', has: false, future: true }
    ];
    const days = raw.map((d) => ({
      dow: d.dow,
      num: d.num,
      label: d.dow + ' ngày ' + d.num + (d.has ? ', có ảnh' : ''),
      bg: d.today ? '#26221E' : 'transparent',
      fg: d.today ? '#F4EFE6' : (d.future ? '#A0968A' : '#4A433C'),
      dot: d.has ? (d.today ? '#F4EFE6' : '#C2402A') : 'transparent'
    }));
    return {
      frame,
      ink: dark ? '#F4EFE6' : '#2E2A26',
      inkSoft: dark ? '#C9C0B4' : '#7A7066',
      accent: this.props.accent ?? '#C2402A',
      days
    };
  }
}
</script>
</body>
</html>

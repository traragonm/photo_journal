<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thư viện ảnh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Patrick+Hand&amp;display=swap">
<style>
body{margin:0}
a{color:#26221E}a:hover{color:#000000}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; isolation: isolate; background: {{wBg}}; transition: background 0.6s ease; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #26221E; display: flex; flex-direction: column">
<canvas ref="{{wCanvasB}}" width="780" height="1688" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none; z-index: -1"></canvas>


<div style="padding: 16px 20px 10px; display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="Quay lại nhật ký" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #26221E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<div style="flex-grow: 1">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Thư viện</h1>
<div style="font-size: 12px; color: #6B6258; margin-top: 2px">{{total}} tấm ảnh</div>
</div>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 4px 18px 32px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
<section style="margin-bottom: 18px">
<h2 style="margin: 6px 2px 12px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6258">{{sec.title}}<span style="font-family: 'Patrick Hand', cursive; font-size: 16px; letter-spacing: 0; text-transform: none">{{sec.count}}</span></h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px">
<sc-for list="{{sec.photos}}" as="ph" hint-placeholder-count="6">
<a href="Detail.dc.html" aria-label="{{ph.label}}" style="text-decoration: none; border: 0; padding: 6px 6px 0; margin: 0; background: #FBFAF6; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 6px 14px rgba(70,45,20,0.16); transform: rotate({{ph.rot}}deg); display: flex; flex-direction: column; align-items: stretch; text-align: left; cursor: pointer; color: #2E2A26">
<span style="display: block; width: 100%; aspect-ratio: 46 / 62; background: linear-gradient({{ph.top}} 0 {{ph.split}}%, {{ph.bottom}} {{ph.split}}%)"></span>
<span style="display: flex; flex-direction: column; justify-content: center; height: 40px; padding: 0 2px; font-family: 'Patrick Hand', cursive; font-size: 15px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ph.caption}}<span style="font-size: 12px; color: #7A7066">{{ph.date}}</span></span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>

<canvas ref="{{wCanvas}}" width="780" height="1688" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none; z-index: 4"></canvas>

<div style="position: absolute; right: 18px; bottom: 32px; width: 56px; height: 56px; z-index: 30">
<sc-if value="{{sOpen}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="Chọn trạng thái" style="position: absolute; right: 66px; top: 1px; width: 236px; height: 54px; box-sizing: border-box; border-radius: 14px; background: #22180C; border: 2px solid #3A3530; box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 0 1px #6E7888, inset 0 2px 8px rgba(0,0,0,0.8); overflow: hidden">
<span style="position: absolute; left: 84px; top: 4px; width: 64px; height: 42px; box-sizing: border-box; border-radius: 10px; border: 2px solid #F2A65A; box-shadow: 0 0 8px rgba(242,166,90,0.6); pointer-events: none"></span>
<div style="position: absolute; left: 0; top: 0; height: 50px; display: flex; transform: translateX({{sRowX}}px); transition: {{sTr}}">
<sc-for list="{{sItems}}" as="it" hint-placeholder-count="5">
<button aria-label="{{it.name}}" aria-pressed="{{it.pressed}}" onClick="{{it.pick}}" style="width: 64px; height: 50px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: {{it.fg}}; text-shadow: 0 0 6px rgba(255,181,71,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; white-space: nowrap; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>{{it.name}}</button>
</sc-for>
</div>
</div>
</sc-if>
<div role="button" tabindex="0" aria-label="{{sLabel}}" aria-haspopup="true" aria-expanded="{{sExpanded}}" onPointerDown="{{sDown}}" onPointerMove="{{sMove}}" onPointerUp="{{sUp}}" onPointerCancel="{{sUp}}" onKeyDown="{{sKey}}" style="position: absolute; left: 0; top: 0; width: 56px; height: 56px; border-radius: 50%; background: #22180C; color: #FFB547; display: flex; align-items: center; justify-content: center; border: 2px solid #3A3530; box-sizing: border-box; box-shadow: 0 0 0 1px #6E7888, 0 0 0 4px #FBFAF6, 0 10px 22px rgba(38,34,30,0.4), inset 0 2px 8px rgba(0,0,0,0.8); filter: drop-shadow(0 0 0 transparent); touch-action: none; cursor: grab; user-select: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="filter: drop-shadow(0 0 4px rgba(255,181,71,0.6))"><path d="{{sFace}}"></path></svg>
<span style="position: absolute; right: 1px; top: 1px; width: 13px; height: 13px; border-radius: 50%; background: #F2A65A; box-shadow: 0 0 0 2px #22180C, 0 0 6px rgba(242,166,90,0.8)"></span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"weather":{"editor":"enum","default":"Nắng","options":["Nắng","Mây","Mưa","Tuyết","Giông"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { ...this.baseVals(), ...this.statusVals(), ...this.weatherVals() };
  }
  weatherVals() {
    const NAMES = ['Nắng', 'Mây', 'Mưa', 'Tuyết', 'Giông'];
    const KEYS = ['sun', 'cloud', 'rain', 'snow', 'storm'];
    const BG = ['#F2E8D5', '#E4E2DE', '#D3DADD', '#EEF2F6', '#C9CCD3'];
    const wi = Math.max(0, NAMES.indexOf(this.props.weather ?? 'Nắng'));
    this._wKey = KEYS[wi];
    this._wDark = false;
    if (!this._wRef) this._wRef = (el) => { this._cv = el; };
    if (!this._wRefB) this._wRefB = (el) => { this._cvB = el; };
    return { wBg: BG[wi], wCanvas: this._wRef, wCanvasB: this._wRefB };
  }
  componentDidMount() {
    this._tick = (t) => { this.wFrame(t); this._raf = requestAnimationFrame(this._tick); };
    this._raf = requestAnimationFrame(this._tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
  }
  wInit(k) {
    const R = Math.random, W = 390, H = 844;
    const o = { k, items: [], clouds: [], leaves: [], splash: [], spark: [] };
    const cl = (n, y1, y2, s1, s2) => { for (let i = 0; i < n; i++) o.clouds.push({ x: -60 + R() * (W + 80), y: y1 + R() * (y2 - y1), s: s1 + R() * (s2 - s1), sp: 0.12 + R() * 0.18, ph: R() * 6.28 }); };
    if (k === 'sun') {
      cl(2, 200, 360, 18, 26);
      for (let i = 0; i < 9; i++) o.spark.push({ x: 20 + R() * (W - 40), y: 150 + R() * 560, s: 4 + R() * 5, ph: R() * 6.28, sp: 0.002 + R() * 0.002 });
    } else if (k === 'cloud') {
      cl(5, 40, 340, 24, 46);
      o.clouds.sort((a, b) => a.s - b.s);
    } else if (k === 'rain' || k === 'storm') {
      cl(k === 'storm' ? 3 : 2, 20, 110, 34, 48);
      const n = k === 'storm' ? 95 : 60;
      for (let i = 0; i < n; i++) o.items.push({ x: R() * (W + 80) - 40, y: R() * H, r: 2.6 + R() * 2.2, s: (k === 'storm' ? 10 : 6) + R() * 5, g: H - 30 - R() * 260 });
      if (k === 'storm') {
        const LC = ['#7FB04A', '#E0993A', '#C8642F', '#9BC25A', '#D9B23C'];
        for (let i = 0; i < 10; i++) o.leaves.push({ x: R() * W, y: R() * H * 0.85, sz: 10 + R() * 7, vx: 4 + R() * 5, vy: 0.4 + R() * 1.2, rot: R() * 6.28, vr: (R() - 0.5) * 0.22, ph: R() * 6.28, col: LC[i % LC.length] });
      }
    } else if (k === 'snow') {
      cl(2, 20, 100, 30, 42);
      for (let i = 0; i < 42; i++) o.items.push({ x: R() * W, y: R() * H, r: 5 + R() * 6, s: 0.6 + R() * 1, ph: R() * 6.28, rot: R() * 6.28, vr: (R() - 0.5) * 0.03, puff: R() < 0.35 });
    }
    return o;
  }
  wRR(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  wCloud(ctx, x, y, s, fill, shade, ink) {
    const C = [[-0.95, 0.12, 0.42], [-0.42, -0.2, 0.58], [0.22, -0.34, 0.7], [0.88, 0.02, 0.48]];
    const shapes = (lw) => {
      ctx.beginPath();
      for (const [cx, cy, r] of C) { ctx.moveTo(x + cx * s + r * s, y + cy * s); ctx.arc(x + cx * s, y + cy * s, r * s, 0, 6.283); }
      this.wRR(ctx, x - 1.35 * s, y - 0.05 * s, 2.7 * s, 0.58 * s, 0.29 * s);
    };
    ctx.lineJoin = 'round';
    shapes(); ctx.strokeStyle = ink; ctx.lineWidth = 5; ctx.stroke();
    shapes(); ctx.fillStyle = fill; ctx.fill();
    ctx.beginPath(); this.wRR(ctx, x - 1.2 * s, y + 0.24 * s, 2.4 * s, 0.22 * s, 0.11 * s); ctx.fillStyle = shade; ctx.fill();
    ctx.beginPath(); ctx.arc(x + 0.05 * s, y - 0.5 * s, 0.16 * s, 3.4, 4.6); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
  }
  wSun(ctx, x, y, r, rot, ink) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.lineJoin = 'round';
    for (let i = 0; i < 12; i++) {
      const L = i % 2 ? r * 1.55 : r * 1.9, w = i % 2 ? 0.16 : 0.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(-w) * r * 1.08, Math.sin(-w) * r * 1.08);
      ctx.lineTo(L, 0);
      ctx.lineTo(Math.cos(w) * r * 1.08, Math.sin(w) * r * 1.08);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? '#FFB547' : '#FFCB4C'; ctx.fill();
      ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.rotate(Math.PI / 6);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283);
    ctx.fillStyle = '#FFD95A'; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.32, r * 0.22, 3.6, 5.2); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.ellipse(x - r * 0.3, y - r * 0.05, r * 0.08, r * 0.12, 0, 0, 6.283); ctx.ellipse(x + r * 0.3, y - r * 0.05, r * 0.08, r * 0.12, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y + r * 0.12, r * 0.24, 0.35, Math.PI - 0.35); ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,110,0.55)';
    ctx.beginPath(); ctx.ellipse(x - r * 0.55, y + r * 0.2, r * 0.14, r * 0.09, 0, 0, 6.283); ctx.ellipse(x + r * 0.55, y + r * 0.2, r * 0.14, r * 0.09, 0, 0, 6.283); ctx.fill();
  }
  wDrop(ctx, x, y, r, fill, ink) {
    ctx.beginPath();
    ctx.moveTo(x, y - 2.3 * r);
    ctx.bezierCurveTo(x + 0.3 * r, y - 1.4 * r, x + r, y - 0.8 * r, x + r, y);
    ctx.arc(x, y, r, 0, Math.PI);
    ctx.bezierCurveTo(x - r, y - 0.8 * r, x - 0.3 * r, y - 1.4 * r, x, y - 2.3 * r);
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.1, r * 0.28, 0, 6.283); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
  }
  wFrame(t) {
    const c = this._cv;
    if (!c) return;
    const ctxF = c.getContext('2d');
    const W = 390, H = 844, R = Math.random;
    ctxF.setTransform(2, 0, 0, 2, 0, 0); ctxF.clearRect(0, 0, W, H);
    const ctxB = this._cvB ? this._cvB.getContext('2d') : ctxF;
    if (ctxB !== ctxF) { ctxB.setTransform(2, 0, 0, 2, 0, 0); ctxB.clearRect(0, 0, W, H); }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const k = this._wKey || 'sun';
    const dt = Math.min(50, t - (this._lt || t));
    this._lt = t;
    const f = dt / 16.67;
    if (!this._p || this._p.k !== k) { this._p = this.wInit(k); this._fl = 0; this._next = t + 1500; this._bolt = null; }
    const P = this._p;
    const dark = this._wDark;
    const INK = dark ? '#1C1D22' : '#3A3530';
    const drawClouds = (fill, shade, ink) => {
      for (const q of P.clouds) {
        q.x += q.sp * f;
        if (q.x - q.s * 1.5 > W) q.x = -q.s * 1.6 - R() * 60;
        this.wCloud(ctxB, q.x, q.y + Math.sin(t * 0.0012 + q.ph) * 3, q.s, fill, shade, ink);
      }
    };
    if (k === 'sun') {
      const sx = W - 70, sy = 92, pulse = Math.sin(t * 0.002);
      const halo = ctxB.createRadialGradient(sx, sy, 30, sx, sy, 150);
      halo.addColorStop(0, 'rgba(255,214,90,0.35)'); halo.addColorStop(1, 'rgba(255,214,90,0)');
      ctxB.fillStyle = halo; ctxB.beginPath(); ctxB.arc(sx, sy, 150, 0, 6.283); ctxB.fill();
      ctxB.strokeStyle = 'rgba(255,190,70,0.45)'; ctxB.lineWidth = 3; ctxB.setLineDash([2, 10]); ctxB.lineCap = 'round';
      ctxB.beginPath(); ctxB.arc(sx, sy, 92 + pulse * 4, 0, 6.283); ctxB.stroke(); ctxB.setLineDash([]);
      this.wSun(ctxB, sx, sy, 32 + pulse * 1.2, t * 0.0004, INK);
      for (const s of P.spark) {
        const a = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph), z = s.s * (0.5 + 0.5 * a);
        ctxB.beginPath();
        ctxB.moveTo(s.x, s.y - z); ctxB.quadraticCurveTo(s.x, s.y, s.x + z, s.y); ctxB.quadraticCurveTo(s.x, s.y, s.x, s.y + z);
        ctxB.quadraticCurveTo(s.x, s.y, s.x - z, s.y); ctxB.quadraticCurveTo(s.x, s.y, s.x, s.y - z);
        ctxB.fillStyle = 'rgba(255,190,60,' + (0.35 + 0.55 * a) + ')'; ctxB.fill();
      }
      drawClouds('#FFFFFF', '#EDE6DA', INK);
    } else if (k === 'cloud') {
      this.wSun(ctxB, W - 92, 84, 24, t * 0.0003, INK);
      drawClouds('#FFFFFF', '#E3E1EA', INK);
    } else if (k === 'rain' || k === 'storm') {
      drawClouds(k === 'storm' ? '#6B6F7C' : '#F4F6F8', k === 'storm' ? '#555966' : '#D3DBE2', INK);
      const wind = k === 'storm' ? 2.6 : 0.8;
      const ang = Math.atan2(wind, 6);
      for (const p of P.items) {
        p.y += p.s * f; p.x += wind * f;
        if (p.y > p.g) {
          if (P.splash.length < 40) P.splash.push({ x: p.x, y: p.y, a: 0 });
          p.y = -20 - R() * 60; p.x = R() * (W + 80) - 40; p.g = H - 30 - R() * 260;
        }
        ctxF.save(); ctxF.translate(p.x, p.y); ctxF.rotate(-ang);
        this.wDrop(ctxF, 0, 0, p.r, dark ? '#9CC7EC' : '#7DB7E8', INK);
        ctxF.restore();
      }
      ctxF.lineCap = 'round';
      for (let i = P.splash.length - 1; i >= 0; i--) {
        const s = P.splash[i]; s.a += 0.06 * f;
        if (s.a >= 1) { P.splash.splice(i, 1); continue; }
        const e = 4 + s.a * 10;
        ctxF.strokeStyle = 'rgba(70,120,170,' + (1 - s.a) * 0.8 + ')'; ctxF.lineWidth = 2;
        ctxF.beginPath();
        ctxF.moveTo(s.x - e * 0.4, s.y - e * 0.2); ctxF.lineTo(s.x - e, s.y - e * 0.7);
        ctxF.moveTo(s.x + e * 0.4, s.y - e * 0.2); ctxF.lineTo(s.x + e, s.y - e * 0.7);
        ctxF.moveTo(s.x, s.y - e * 0.4); ctxF.lineTo(s.x, s.y - e);
        ctxF.stroke();
      }
      if (k === 'storm') {
        const gust = 1 + 0.7 * Math.sin(t * 0.0009);
        for (const d of P.leaves) {
          d.x += d.vx * gust * f; d.y += (d.vy + Math.sin(t * 0.003 + d.ph) * 1.6) * f; d.rot += d.vr * gust * f;
          if (d.x > W + 40 || d.y > H + 40) { d.x = -40 - R() * 220; d.y = R() * H * 0.8; }
          ctxF.save(); ctxF.translate(d.x, d.y); ctxF.rotate(d.rot);
          ctxF.scale(1, 0.4 + 0.6 * Math.abs(Math.cos(t * 0.004 + d.ph)));
          const s2 = d.sz;
          ctxF.beginPath(); ctxF.moveTo(-s2, 0);
          ctxF.quadraticCurveTo(0, -s2 * 0.8, s2, 0); ctxF.quadraticCurveTo(0, s2 * 0.8, -s2, 0);
          ctxF.fillStyle = d.col; ctxF.fill(); ctxF.strokeStyle = INK; ctxF.lineWidth = 1.8; ctxF.stroke();
          ctxF.beginPath(); ctxF.moveTo(-s2 * 1.3, 0); ctxF.lineTo(s2 * 0.7, 0); ctxF.stroke();
          ctxF.restore();
        }
        if (t > this._next) {
          this._fl = 1; this._next = t + 3500 + R() * 6000;
          const q = P.clouds[Math.floor(R() * P.clouds.length)];
          this._bolt = { x: Math.max(40, Math.min(W - 60, q ? q.x : W / 2)), y: (q ? q.y : 60) + 20, s: 1.3 + R() * 0.6 };
        }
        if (this._fl > 0.02) {
          ctxF.fillStyle = 'rgba(255,248,210,' + this._fl * 0.28 + ')'; ctxF.fillRect(0, 0, W, H);
          if (this._bolt && this._fl > 0.25) {
            const b = this._bolt, B = [[0, 0], [24, 0], [12, 34], [30, 34], [-4, 96], [6, 50], [-12, 50]];
            ctxF.beginPath();
            B.forEach((pt, i) => { const X = b.x + pt[0] * b.s, Y = b.y + pt[1] * b.s; i ? ctxF.lineTo(X, Y) : ctxF.moveTo(X, Y); });
            ctxF.closePath(); ctxF.lineJoin = 'round';
            ctxF.fillStyle = '#FFE066'; ctxF.fill(); ctxF.strokeStyle = INK; ctxF.lineWidth = 3; ctxF.stroke();
          }
          this._fl *= Math.pow(0.9, f);
        }
      }
    } else if (k === 'snow') {
      drawClouds('#FFFFFF', '#DCE6F0', INK);
      ctxF.lineCap = 'round';
      for (const p of P.items) {
        p.y += p.s * f; p.x += Math.sin(t * 0.0012 + p.ph) * 0.6 * f; p.rot += p.vr * f;
        if (p.y > H + 14) { p.y = -14; p.x = R() * W; }
        if (p.puff) {
          ctxF.beginPath(); ctxF.arc(p.x, p.y, p.r * 0.55, 0, 6.283);
          ctxF.fillStyle = '#FFFFFF'; ctxF.fill(); ctxF.strokeStyle = INK; ctxF.lineWidth = 1.6; ctxF.stroke();
          continue;
        }
        ctxF.save(); ctxF.translate(p.x, p.y); ctxF.rotate(p.rot);
        ctxF.beginPath();
        for (let j = 0; j < 6; j++) {
          ctxF.moveTo(0, 0); ctxF.lineTo(0, -p.r);
          ctxF.moveTo(0, -p.r * 0.55); ctxF.lineTo(-p.r * 0.3, -p.r * 0.82);
          ctxF.moveTo(0, -p.r * 0.55); ctxF.lineTo(p.r * 0.3, -p.r * 0.82);
          ctxF.rotate(Math.PI / 3);
        }
        ctxF.strokeStyle = INK; ctxF.lineWidth = 4.2; ctxF.stroke();
        ctxF.strokeStyle = '#FFFFFF'; ctxF.lineWidth = 2; ctxF.stroke();
        ctxF.restore();
      }
      if (this._capCards) {
        this._acc = Math.min(1, (this._acc || 0) + dt / 25000);
        const cr = c.getBoundingClientRect();
        const sc = cr.width / W || 1;
        const fan = c.parentElement && c.parentElement.querySelector('figure');
        const box = fan && fan.parentElement;
        if (box) {
          const br = box.getBoundingClientRect();
          const ox = (br.left - cr.left) / sc, oy = (br.top - cr.top) / sc;

              const edge = Math.min(1, Math.min(i, 14 - i) / 2);

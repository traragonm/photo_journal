<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2402A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { zoom: 1, frame: 0, filter: 0, flash: 1, timer: 0, weather: 0, mood: 0, drag: null };
  }
  handlers(key, n, item, width, tapSelect, axis) {
    const V = axis === 'y';
    const pos = (e) => (V ? e.clientY : e.clientX);
    const clamp = (i) => Math.max(0, Math.min(n - 1, i));
    return {
      down: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        this.setState({ drag: { key, x: pos(e), left: V ? r.top : r.left, scale: ((V ? r.height : r.width) / width) || 1, start: this.state[key], dx: 0 } });
      },
      move: (e) => {
        const d = this.state.drag;
        if (!d || d.key !== key) return;
        this.setState({ drag: { ...d, dx: (pos(e) - d.x) / d.scale } });
      },
      up: (e) => {
        const d = this.state.drag;
        if (!d || d.key !== key) return;
        let i;
        if (Math.abs(d.dx) < 5) {
          i = tapSelect === 'cycle' ? (d.start + 1) % n : tapSelect ? clamp(d.start + Math.round(((pos(e) - d.left) / d.scale - width / 2) / item)) : d.start;
        } else {
          i = clamp(Math.round(d.start - d.dx / item));
        }
        this.setState({ [key]: i, drag: null });
      },
      key: (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); this.setState({ [key]: clamp(this.state[key] - 1) }); }
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); this.setState({ [key]: clamp(this.state[key] + 1) }); }
      }
    };
  }
  stripPos(key, n, item, width) {
    const d = this.state.drag;
    const v = this.state[key];
    const open = !!d && d.key === key;
    const dx = open ? Math.max(-(n - 1 - d.start) * item - 30, Math.min(d.start * item + 30, d.dx)) : 0;
    const hover = open ? Math.max(0, Math.min(n - 1, Math.round(d.start - dx / item))) : v;
    return { open, dx, hover, base: open ? d.start : v };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2402A';

    const Z = [0.5, 1, 1.5, 2, 3, 4, 5];
    const zp = this.stripPos('zoom', Z.length, 72, 390);
    const fmt = (v) => (v === 0.5 ? '.5' : String(v)) + '×';
    const zoomS = {
      max: Z.length - 1, value: this.state.zoom,
      x: Math.round(195 - 36 - zp.base * 72 + zp.dx),
      tr: zp.open ? 'none' : 'transform 0.25s ease',
      items: Z.map((v, i) => ({
        label: fmt(v),
        color: i === zp.hover ? '#F2A65A' : '#CFC6B8',
        size: i === zp.hover ? 16 : 13,
        glow: i === zp.hover ? '0 0 8px rgba(242,166,90,0.7)' : 'none',
        tick: i === zp.hover ? '#F2A65A' : '#8A7F70'
      })),
      ...this.handlers('zoom', Z.length, 72, 390, true)
    };

    const FL = [
      { name: 'Gốc', css: 'none' },
      { name: 'Ấm', css: 'sepia(0.25) saturate(1.35) hue-rotate(-10deg)' },
      { name: 'Phai', css: 'contrast(0.8) brightness(1.1) saturate(0.65)' },
      { name: 'Đen trắng', css: 'grayscale(1) contrast(1.1)' },
      { name: 'Lạnh', css: 'hue-rotate(15deg) saturate(1.15) brightness(1.03)' },
      { name: 'Hoài cổ', css: 'sepia(0.7) contrast(0.95)' }
    ];
    const fp = this.stripPos('filter', FL.length, 72, 390);
    const filterS = {
      max: FL.length - 1, value: this.state.filter,
      x: Math.round(195 - 36 - fp.base * 72 + fp.dx),
      tr: fp.open ? 'none' : 'transform 0.25s ease',
      items: FL.map((f, i) => ({
        name: f.name, css: f.css,
        color: i === fp.hover ? '#F1E9DA' : '#8E857A',
        border: i === fp.hover ? '#F2A65A' : 'transparent',
        glow: i === fp.hover ? '0 0 10px rgba(242,166,90,0.5)' : 'none'
      })),
      ...this.handlers('filter', FL.length, 72, 390, true)
    };

    const mkTicks = (labels, v) => labels.map((l, i) => ({ label: l, left: 2 + i * 33 - 1, color: i === v ? '#F1E9DA' : '#8E857A' }));
    const fl = this.state.flash, tm = this.state.timer;
    const FLL = ['TẮT', 'AUTO', 'BẬT'], TML = ['TẮT', '3s', '10s'];
    const sliders = [
      { x: 14, label: 'Đèn flash', icon: 'M13 2 4 14h7l-1 8 9-12h-7z', value: fl, thumb: 3 + fl * 33, ticks: mkTicks(FLL, fl), text: FLL[fl],
        led: fl === 2 ? '#F2B441' : (fl === 1 ? '#8A6A2A' : '#3A3530'), glow: fl === 2 ? '0 0 6px rgba(242,180,65,0.9)' : 'none',
        change: (e) => this.setState({ flash: Number(e.target.value) }) },
      { x: 238, label: 'Hẹn giờ', icon: 'M12 5a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 9v4l2 2M9 2h6', value: tm, thumb: 3 + tm * 33, ticks: mkTicks(TML, tm), text: TML[tm],
        led: tm > 0 ? '#F2B441' : '#3A3530', glow: tm > 0 ? '0 0 6px rgba(242,180,65,0.9)' : 'none',
        change: (e) => this.setState({ timer: Number(e.target.value) }) }
    ];

    const FACE = 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18';
    const FR = [
      { name: 'Mini', letter: 'M', bw: 12, bh: 17, fs: 8, d: 'M8 3h8v18H8z', w: 54, h: 86, iw: 46, ih: 62 },
      { name: 'Square', letter: 'SQ', bw: 16, bh: 16, fs: 7, d: 'M5 4h14v16H5z', w: 72, h: 86, iw: 62, ih: 62 },
      { name: 'Wide', letter: 'W', bw: 21, bh: 14, fs: 8, d: 'M2 7h20v11H2z', w: 108, h: 86, iw: 99, ih: 62 }
    ];
    const WE = [
      { name: 'Nắng', d: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' },
      { name: 'Mây', d: 'M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z' },
      { name: 'Mưa', d: 'M7 14h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 14zM8 17l-1 3M12 17l-1 3M16 17l-1 3' },
      { name: 'Lạnh', d: 'M12 2v20M4 6l16 12M20 6 4 18' }
    ];
    const MO = [
      { name: 'Vui', d: FACE + 'M9 10h.01M15 10h.01M8 14c1.2 1.6 2.5 2.4 4 2.4s2.8-.8 4-2.4' },
      { name: 'Bình yên', d: FACE + 'M7.5 10.5c.6-.6 1.4-.6 2 0M14.5 10.5c.6-.6 1.4-.6 2 0M9.5 15c1.5 1 3.5 1 5 0' },
      { name: 'Buồn', d: FACE + 'M9 10h.01M15 10h.01M8 16.5c1.2-1.6 2.5-2.4 4-2.4s2.8.8 4 2.4' },
      { name: 'Mệt', d: FACE + 'M8 10h2.5M13.5 10h2.5M9 15.5h6' }
    ];

    const ITEM = 64;
    const mkDrum = (key, title, opts, left, top) => {
      const v = this.state[key];
      const n = opts.length;
      const p = this.stripPos(key, n, ITEM, 100);
      const winCenter = left + 50;
      const olAbs = Math.max(14, Math.min(376 - 236, winCenter - 118));
      const centerInOl = winCenter - olAbs;
      return {
        title, left, top, max: n - 1, value: v, name: opts[v].name, d: opts[v].d, open: p.open,
        olLeft: olAbs - left,
        hl: centerInOl - 32,
        rowX: Math.round(centerInOl - ITEM / 2 - p.base * ITEM + p.dx),
        items: opts.map((o, i) => ({ name: o.name, d: o.d, color: i === p.hover ? '#FFB547' : '#7A5A2E' })),
        ...this.handlers(key, n, ITEM, 100, false)
      };
    };
    const drums = [
      mkDrum('weather', 'THỜI TIẾT', WE, 20, 747),
      mkDrum('mood', 'CẢM XÚC', MO, 270, 747)
    ];

    const fpv = this.stripPos('frame', FR.length, 52, 76);
    const fv = this.state.frame;
    const frameD = {
      value: fv, name: FR[fv].name, letter: FR[fv].letter, w: FR[fv].bw, h: FR[fv].bh, fs: FR[fv].fs, open: fpv.open,
      rowY: Math.round(94 - 26 - fpv.base * 52 + fpv.dx),
      items: FR.map((o, i) => ({ name: o.name, letter: o.letter, w: o.bw, h: o.bh, fs: o.fs, color: i === fpv.hover ? '#FFB547' : '#7A5A2E' })),
      ...this.handlers('frame', FR.length, 52, 76, false, 'y')
    };
    const cur = FR[this.state.frame];
    const k = Math.min(356 / cur.w, 430 / cur.h);
    const zv = Z[this.state.zoom];
    const li = this.state.filter;
    return {
      accent, sliders, drums, zoomS, filterS, frameD,
      filterName: FL[li].name, filterCss: FL[li].css,
      zs: (1 + (zv - 0.5) * 0.35).toFixed(3),
      zoomLabel: (zv === 0.5 ? '0.5' : String(zv)) + '×',
      weatherD: WE[this.state.weather].d,
      moodD: MO[this.state.mood].d,
      fw: Math.round(cur.w * k), fh: Math.round(cur.h * k),
      iw: Math.round(cur.iw * k), ih: Math.round(cur.ih * k),
      pad: Math.round((cur.w - cur.iw) / 2 * k)
    };
  }
}
